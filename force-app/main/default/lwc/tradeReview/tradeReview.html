<template>
  <lightning-card title="Trade Review" icon-name="standard:approval">
    <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
      <span class="slds-badge slds-m-right_small claude-badge"
        >{claudeLabel}</span
      >
      <lightning-radio-group
        class="slds-m-right_small"
        name="scope"
        label="Show"
        variant="label-hidden"
        type="button"
        options={scopeOptions}
        value={scope}
        onchange={handleScopeChange}
      ></lightning-radio-group>
      <lightning-button-icon
        class="slds-m-right_x-small"
        icon-name="utility:refresh"
        alternative-text="Refresh"
        title="Refresh"
        onclick={handleRefresh}
      ></lightning-button-icon>
      <lightning-button
        class="open-upload"
        label="Upload file"
        icon-name="utility:upload"
        onclick={handleOpenUpload}
      ></lightning-button>
    </div>

    <div class="slds-p-horizontal_medium">
      <template lwc:if={working}>
        <div
          class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small working"
          role="status"
        >
          <lightning-icon
            icon-name="utility:sync"
            size="x-small"
            class="slds-m-right_x-small"
          ></lightning-icon>
          {workingText}
        </div>
      </template>
      <template lwc:if={loadError}>
        <div
          class="slds-text-color_error slds-m-bottom_small load-error"
          role="alert"
        >
          {loadError}
        </div>
      </template>
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading the review queue"
          size="small"
        ></lightning-spinner>
      </template>

      <lightning-layout multiple-rows>
        <!-- Queue -->
        <lightning-layout-item
          size="12"
          medium-device-size="4"
          padding="around-small"
        >
          <lightning-tabset active-tab-value={activeTab}>
            <lightning-tab
              label={codesLabel}
              value="codes"
              onactive={handleTabActive}
            >
              <template lwc:if={heldNote}>
                <div
                  class="slds-box slds-box_x-small slds-m-bottom_small held-note"
                >
                  {heldNote}
                </div>
              </template>
              <c-review-queue-table
                class="codes-table"
                items={codeTableItems}
                selected-key={selectedKey}
                first-label="Code or row"
                last-label="Held or amount"
                empty-text="No rep codes need review."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={rowsLabel}
              value="rows"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="rows-table"
                items={decisionTableItems}
                selected-key={selectedKey}
                empty-text="Nothing needs a decision."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={holdLabel}
              value="hold"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="hold-table"
                items={holdTableItems}
                selected-key={selectedKey}
                empty-text="Nothing is on hold."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={firmsLabel}
              value="firms"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="firms-table"
                items={firmTableItems}
                selected-key={selectedKey}
                first-label="Firm"
                type-label="Status"
                last-label="Questions"
                empty-text="No questions are waiting for a firm. Put a row on hold, or open a code review, to ask one."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={mappingsLabel}
              value="mappings"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="mappings-table"
                items={mappingTableItems}
                selected-key={selectedKey}
                first-label="File"
                type-label="Status"
                last-label=""
                empty-text="Every file format is known."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label="Recent Files"
              value="files"
              onactive={handleTabActive}
            >
              <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                Cloud folders
              </h3>
              <template lwc:if={hasCloudSources}>
                <ul class="slds-m-bottom_medium">
                  <template for:each={cloudViews} for:item="src">
                    <li
                      key={src.key}
                      class="queue-item slds-p-around_x-small cloud-source"
                    >
                      <span class="slds-text-title_bold slds-show"
                        >{src.title}</span
                      >
                      <template lwc:if={src.failed}>
                        <span
                          class="slds-text-body_small slds-text-color_error slds-show cloud-status"
                          >{src.statusText}</span
                        >
                      </template>
                      <template lwc:else>
                        <span
                          class="slds-text-body_small slds-show cloud-status"
                          >{src.statusText}</span
                        >
                      </template>
                      <div
                        class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end slds-m-top_x-small"
                      >
                        <div
                          class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3"
                        >
                          <lightning-combobox
                            class="pull-frequency"
                            label="Check for new files"
                            options={pullFrequencies}
                            value={src.frequency}
                            data-id={src.id}
                            disabled={busy}
                            onchange={handlePullFrequency}
                          ></lightning-combobox>
                        </div>
                        <template lwc:if={src.isDaily}>
                          <div
                            class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"
                          >
                            <lightning-combobox
                              class="pull-hour"
                              label="At"
                              options={pullHours}
                              value={src.hourValue}
                              data-id={src.id}
                              disabled={busy}
                              onchange={handlePullHour}
                            ></lightning-combobox>
                          </div>
                        </template>
                        <div class="slds-col slds-no-flex">
                          <lightning-button
                            class="pull-now"
                            label="Pull now"
                            data-id={src.id}
                            disabled={src.pullDisabled}
                            onclick={handlePullNow}
                          ></lightning-button>
                        </div>
                      </div>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p
                  class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium no-cloud"
                >
                  No cloud folders are connected. An admin adds one as a Cloud
                  Source record (see PHASE4C.md).
                </p>
              </template>
              <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                Recent files
              </h3>
              <template lwc:if={hasFiles}>
                <ul>
                  <template for:each={fileViews} for:item="file">
                    <li
                      key={file.id}
                      class="queue-item slds-p-around_x-small file-item"
                    >
                      <span class="slds-text-title_bold slds-show"
                        >{file.sourceFirm} · {file.fileName}</span
                      >
                      <span class="slds-text-body_small slds-show"
                        >{file.summary}</span
                      >
                      <template lwc:if={file.message}>
                        <span
                          class="slds-text-body_small slds-text-color_error slds-show"
                          >{file.message}</span
                        >
                      </template>
                      <template lwc:if={file.canLoad}>
                        <lightning-button
                          class="slds-m-top_x-small slds-show"
                          variant="brand"
                          label={file.loadLabel}
                          data-id={file.id}
                          disabled={busy}
                          onclick={handleLoadFile}
                        ></lightning-button>
                        <template lwc:if={file.loadNote}>
                          <span
                            class="slds-text-body_small slds-text-color_weak slds-show"
                            >{file.loadNote}</span
                          >
                        </template>
                      </template>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p class="slds-text-color_weak">No files received yet.</p>
              </template>
            </lightning-tab>
          </lightning-tabset>
        </lightning-layout-item>

        <!-- Detail -->
        <lightning-layout-item
          size="12"
          medium-device-size="8"
          padding="around-small"
        >
          <template lwc:if={nothingSelected}>
            <div class="slds-box slds-text-color_weak nothing-selected">
              Choose an item on the left.
            </div>
          </template>

          <!-- A row or a code review: one layout (header, what came in, Claude's answer, your decision, actions) -->
          <template lwc:if={detail}>
            <div class={detail.cssClass}>
              <div class="tv-section item-header">
                <div class="item-heading">
                  <div class="chips">
                    <span class="tv-chip kind-chip">{detail.kindLabel}</span>
                    <span class={detail.statusClass}>{detail.statusLabel}</span>
                  </div>
                  <h2 class="slds-text-heading_medium headline">
                    {detail.title}
                  </h2>
                  <p class="slds-text-body_small slds-text-color_weak origin">
                    {detail.origin}
                  </p>
                </div>
                <div class="assignee">
                  <span class="slds-text-body_small slds-text-color_weak"
                    >Assigned to</span
                  >
                  <div class="assignee-line">
                    <template lwc:if={isUnassigned}>
                      <span class="slds-text-color_weak">Nobody</span>
                      <lightning-button
                        class="assign"
                        label="Assign to me"
                        disabled={busy}
                        onclick={handleAssignToMe}
                      ></lightning-button>
                    </template>
                    <template lwc:if={isMine}>
                      <span>You</span>
                      <lightning-button
                        class="unassign"
                        label="Unassign"
                        disabled={busy}
                        onclick={handleUnassign}
                      ></lightning-button>
                    </template>
                    <template lwc:if={assignedToOther}>
                      <span class="assigned-other"
                        >{detail.assignedToName}</span
                      >
                    </template>
                  </div>
                </div>
              </div>

              <template lwc:if={detail.onHold}>
                <div class="tv-section hold-box" role="status">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                    class="hold-icon"
                  ></lightning-icon>
                  <div class="hold-text-block">
                    <p class="slds-text-title_bold hold-title">
                      {detail.holdTitle}
                    </p>
                    <p class="hold-homework">{detail.holdReason}</p>
                    <template lwc:if={detail.askedLabel}>
                      <p class="slds-text-body_small slds-m-top_xx-small">
                        {detail.askedLabel}
                      </p>
                    </template>
                  </div>
                </div>
              </template>

              <!-- 1 · What came in -->
              <div class="tv-section came-in">
                <h3 class="section-title">1 · What came in</h3>
                <template lwc:if={selectedRow}>
                  <div class="reasons">
                    <template for:each={selectedRow.whyLines} for:item="reason">
                      <p key={reason} class="issue-text">{reason}</p>
                    </template>
                  </div>
                  <template lwc:if={selectedIsGroup}>
                    <p
                      class="slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small"
                    >
                      {fileHeading}
                    </p>
                  </template>
                  <div class="table-box">
                    <table
                      class="slds-table slds-table_cell-buffer slds-table_bordered file-table"
                    >
                      <thead>
                        <tr>
                          <template for:each={rowCells} for:item="c">
                            <th key={c.key} scope="col" class={c.headClass}>
                              {c.label}
                            </th>
                          </template>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <template for:each={rowCells} for:item="c">
                            <td key={c.key} class={c.cellClass}>
                              {c.value}
                              <template lwc:if={c.note}>
                                <span class="cell-note">{c.note}</span>
                              </template>
                            </td>
                          </template>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <template lwc:if={rowExtra}>
                    <p
                      class="slds-text-body_small slds-text-color_weak slds-m-top_x-small row-extra"
                    >
                      {rowExtra}
                    </p>
                  </template>
                  <template lwc:if={selectedIsGroup}>
                    <div class="slds-m-top_small group-box">
                      <p class="slds-text-title_bold group-summary">
                        {groupSummary}
                      </p>
                      <template lwc:if={issueRows}>
                        <div class="table-box slds-m-top_x-small">
                          <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered issue-rows"
                          >
                            <thead>
                              <tr>
                                <th scope="col">File and row</th>
                                <th scope="col">Date</th>
                                <th scope="col">Code</th>
                                <th scope="col">Advisor</th>
                                <th scope="col">Firm</th>
                                <th scope="col">Fund</th>
                                <th scope="col">Amount</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template for:each={issueRows} for:item="i">
                                <tr key={i.key}>
                                  <td class="slds-cell-wrap">{i.where}</td>
                                  <td>{i.tradeDate}</td>
                                  <td>{i.repCode}</td>
                                  <td class="slds-cell-wrap">
                                    {i.advisorName}
                                  </td>
                                  <td class="slds-cell-wrap">{i.firmName}</td>
                                  <td class="slds-cell-wrap">{i.fundName}</td>
                                  <td>{i.amountText}</td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <template lwc:if={issueRowsNote}>
                          <p
                            class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                          >
                            {issueRowsNote}
                          </p>
                        </template>
                      </template>
                    </div>
                  </template>
                </template>
                <template lwc:if={selectedFollowUp}>
                  <div class="issue-box">
                    <p class="issue-text followup-issue">
                      {selectedFollowUp.issueText}
                    </p>
                    <p class="issue-sub followup-held">
                      {selectedFollowUp.subtitle}
                    </p>
                  </div>
                  <template lwc:if={hasHeldRows}>
                    <div class="table-box">
                      <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered held-table"
                      >
                        <thead>
                          <tr>
                            <th scope="col">Date</th>
                            <th scope="col">Type</th>
                            <th scope="col">Code</th>
                            <th scope="col">Advisor named</th>
                            <th scope="col">Fund</th>
                            <th scope="col" class="amount-cell">Amount</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template for:each={heldRowViews} for:item="h">
                            <tr key={h.key}>
                              <td>{h.tradeDate}</td>
                              <td>
                                {h.typeText}
                                <template lwc:if={h.waitText}>
                                  <span
                                    class="slds-badge slds-m-left_xx-small wait-badge"
                                    >{h.waitText}</span
                                  >
                                </template>
                              </td>
                              <td class={h.codeClass}>
                                {h.codeText}
                                <template lwc:if={h.codeNote}>
                                  <span class="cell-note">{h.codeNote}</span>
                                </template>
                              </td>
                              <td class={h.advisorClass}>
                                {h.advisorText}
                                <template lwc:if={h.advisorNote}>
                                  <span class="cell-note">{h.advisorNote}</span>
                                </template>
                              </td>
                              <td class="slds-cell-wrap">{h.fundText}</td>
                              <td class="amount-cell">{h.amountText}</td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <template lwc:if={heldRowsNote}>
                      <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                      >
                        {heldRowsNote}
                      </p>
                    </template>
                  </template>
                </template>
              </div>

              <!-- 2 · Claude's answer -->
              <div class="tv-section claude-box">
                <div class="section-head">
                  <h3 class="section-title">2 · Claude's answer</h3>
                  <template lwc:if={detail.hasConfidence}>
                    <span class={detail.confidenceBadge}
                      >{detail.aiConfidence} confidence</span
                    >
                  </template>
                  <span class="section-spacer"></span>
                  <template lwc:if={detail.aiRequestId}>
                    <button
                      class="slds-button request-link"
                      data-id={detail.aiRequestId}
                      onclick={handleOpenRecord}
                    >
                      See the request ({detail.aiRequestName})
                    </button>
                  </template>
                </div>
                <template lwc:if={hasSuggestion}>
                  <template lwc:if={hasFieldTable}>
                    <div class="table-box">
                      <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered field-table"
                      >
                        <thead>
                          <tr>
                            <th scope="col">Field</th>
                            <th scope="col">Claude says</th>
                            <th scope="col">Confidence</th>
                            <th scope="col">Why</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template for:each={fieldTable} for:item="l">
                            <tr key={l.key}>
                              <td>{l.field}</td>
                              <td class={l.valueClass}>{l.value}</td>
                              <td>
                                <span class={l.confidenceClass}
                                  >{l.confidence}</span
                                >
                              </td>
                              <td class="slds-cell-wrap">{l.reason}</td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template lwc:else>
                    <template for:each={suggestedChoices} for:item="c">
                      <p key={c.label} class="choice">
                        <span class="slds-text-color_weak choice-label"
                          >{c.label}:</span
                        ><span class="choice-value">{c.value}</span>
                      </p>
                    </template>
                  </template>
                  <template lwc:if={detail.actionLabel}>
                    <p class="slds-text-title_bold slds-m-top_small ai-action">
                      {detail.actionLabel}
                    </p>
                  </template>
                  <template lwc:if={suggestionText}>
                    <h3 class="sub-title slds-m-top_small">Why</h3>
                    <p class="suggestion">{suggestionText}</p>
                  </template>
                </template>
                <template lwc:else>
                  <p class="slds-text-color_weak claude-state">{claudeState}</p>
                </template>
                <template lwc:if={claudeQuestion}>
                  <div class="question-box">
                    <h3 class="sub-title">Question for the firm</h3>
                    <p class="homework">{claudeQuestion}</p>
                    <template lwc:if={questionAskedLabel}>
                      <p class="slds-text-body_small slds-text-color_weak">
                        {questionAskedLabel}
                      </p>
                    </template>
                  </div>
                </template>
              </div>

              <!-- 3 · Your decision -->
              <div class="tv-section decision">
                <h3 class="section-title">3 · Your decision</h3>
                <template lwc:if={selectedRow}>
                  <template lwc:if={selectedRow.settlesFollowUpId}>
                    <div
                      class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small settles-box"
                    >
                      <p class="slds-text-title_bold">
                        Also settles a code review
                      </p>
                      <p class="slds-m-top_xx-small settles-text">
                        {selectedRow.settlesText}. Rows on that review dated
                        from this change that name this advisor (or no one) wait
                        for this decision.
                      </p>
                      <button
                        class="slds-button slds-m-top_xx-small go-review"
                        data-key={selectedRow.settlesKey}
                        onclick={handleGoTo}
                      >
                        View the code review
                      </button>
                    </div>
                  </template>
                  <template lwc:if={selectedRow.hasPlan}>
                    <div class="slds-m-bottom_small approval-plan">
                      <p class="slds-text-title_bold slds-m-bottom_xx-small">
                        Approving will
                      </p>
                      <ul class="slds-list_dotted">
                        <template
                          for:each={selectedRow.planLines}
                          for:item="line"
                        >
                          <li key={line.key}>{line.text}</li>
                        </template>
                      </ul>
                    </div>
                  </template>
                  <p
                    class="slds-text-body_small slds-m-bottom_x-small decision-help"
                  >
                    {decisionHelp}
                  </p>
                  <div class="choices">
                    <template lwc:if={selectedRow.needsFirm}>
                      <lightning-combobox
                        class="firm-choice"
                        label={firmChoiceLabel}
                        placeholder="Choose the firm"
                        options={firmOptions}
                        value={firmChoice}
                        onchange={handleFirmChoice}
                      ></lightning-combobox>
                    </template>
                    <template lwc:if={selectedRow.needsFund}>
                      <lightning-combobox
                        class="fund-choice"
                        label={fundChoiceLabel}
                        placeholder="Choose the fund"
                        options={fundOptions}
                        value={fundChoice}
                        onchange={handleFundChoice}
                      ></lightning-combobox>
                    </template>
                    <template lwc:if={selectedRow.needsAdvisor}>
                      <lightning-combobox
                        class="advisor-choice"
                        label={advisorChoiceLabel}
                        placeholder="Choose the advisor"
                        options={selectedRow.advisorOptions}
                        value={advisorChoice}
                        onchange={handleAdvisorChoice}
                      ></lightning-combobox>
                    </template>
                  </div>
                  <template lwc:if={selectedRow.canRemember}>
                    <lightning-input
                      class="slds-m-top_x-small remember"
                      type="checkbox"
                      label="Remember this spelling for future files"
                      checked={remember}
                      onchange={handleRemember}
                    ></lightning-input>
                  </template>
                </template>
                <template lwc:if={selectedFollowUp}>
                  <template lwc:if={rosterFirst}>
                    <div
                      class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_small roster-first"
                    >
                      <p class="slds-text-title_bold">
                        Decide the roster change first
                      </p>
                      <p class="slds-m-top_xx-small">
                        The firm's roster changes code
                        {selectedFollowUp.repCode}
                        ({selectedFollowUp.rosterText}). Approving it updates
                        who holds the code, closes this review and re-matches
                        these rows. Rejecting it unlocks the options below.
                      </p>
                      <template lwc:if={rosterVisible}>
                        <button
                          class="slds-button slds-m-top_xx-small go-roster"
                          data-key={rosterKey}
                          onclick={handleGoTo}
                        >
                          Open the roster change
                        </button>
                      </template>
                      <template lwc:else>
                        <p class="slds-text-body_small slds-m-top_xx-small">
                          It is not in this view. Choose All to see it.
                        </p>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={rosterPartial}>
                    <div
                      class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_small roster-partial"
                    >
                      <p class="slds-text-title_bold">
                        The roster change comes first for some rows
                      </p>
                      <p class="slds-m-top_xx-small">{rosterPartialText}</p>
                      <template lwc:if={rosterVisible}>
                        <button
                          class="slds-button slds-m-top_xx-small go-roster"
                          data-key={rosterKey}
                          onclick={handleGoTo}
                        >
                          Open the roster change
                        </button>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={rosterInfo}>
                    <div
                      class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small roster-info"
                    >
                      <p>{rosterInfoText}</p>
                      <template lwc:if={rosterVisible}>
                        <button
                          class="slds-button slds-m-top_xx-small go-roster"
                          data-key={rosterKey}
                          onclick={handleGoTo}
                        >
                          Open the roster change
                        </button>
                      </template>
                    </div>
                  </template>
                  <fieldset class="fix-options">
                    <legend
                      class="slds-text-body_small slds-m-bottom_x-small code-help"
                    >
                      {codeReviewHelp}
                    </legend>
                    <template for:each={fixOptions} for:item="o">
                      <div key={o.value} class={o.cardClass}>
                        <label class="fix-label">
                          <input
                            type="radio"
                            name="fix"
                            class="fix-radio"
                            value={o.value}
                            checked={o.checked}
                            disabled={o.disabled}
                            onchange={handleFixChoice}
                          />
                          <span class="fix-text">
                            <span class="fix-title"
                              >{o.title}<span class="from-claude"
                                >{o.claudeTag}</span
                              ></span
                            >
                            <span class="fix-help">{o.help}</span>
                          </span>
                        </label>
                        <template lwc:if={o.isCredit}>
                          <lightning-combobox
                            class="credit-choice slds-m-top_x-small"
                            label="Advisor to credit"
                            placeholder="Choose the advisor"
                            options={selectedFollowUp.creditOptions}
                            value={creditChoice}
                            disabled={rosterFirst}
                            onchange={handleCreditChoice}
                          ></lightning-combobox>
                        </template>
                      </div>
                    </template>
                  </fieldset>
                </template>
              </div>

              <!-- Actions: always in the same place, the main action first -->
              <div class="action-bar">
                <template lwc:if={selectedRow}>
                  <lightning-button
                    class="accept"
                    variant="brand"
                    label={acceptLabel}
                    disabled={acceptDisabled}
                    onclick={handleAccept}
                  ></lightning-button>
                </template>
                <template lwc:if={selectedFollowUp}>
                  <lightning-button
                    class="apply-fix"
                    variant="brand"
                    label={fixApplyLabel}
                    disabled={fixApplyDisabled}
                    onclick={handleApplyFix}
                  ></lightning-button>
                </template>
                <template lwc:if={selectedIsOpen}>
                  <lightning-button
                    class="hold"
                    label={holdButtonLabel}
                    icon-name="utility:clock"
                    disabled={busy}
                    onclick={handleOpenHold}
                  ></lightning-button>
                </template>
                <template lwc:if={selectedIsOnHold}>
                  <lightning-button
                    class="release"
                    label={releaseLabel}
                    disabled={busy}
                    onclick={handleRelease}
                  ></lightning-button>
                </template>
                <template lwc:if={selectedRow}>
                  <lightning-button
                    class="reject"
                    variant="destructive-text"
                    label={rejectLabel}
                    disabled={busy}
                    onclick={handleReject}
                  ></lightning-button>
                </template>
                <span class="section-spacer"></span>
                <template lwc:if={selectedFollowUp}>
                  <button
                    class="slds-button open-followup"
                    data-id={selectedFollowUp.id}
                    onclick={handleOpenRecord}
                  >
                    Open {selectedFollowUp.name}
                  </button>
                </template>
              </div>
            </div>
          </template>

          <!-- A firm with questions waiting for its answer -->
          <template lwc:if={selectedFirm}>
            <div class="firm-detail">
              <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">
                {selectedFirm.firmName}
              </h2>
              <p class="slds-text-body_small slds-m-bottom_small firm-status">
                {selectedFirm.questionsText} · {selectedFirm.status}
              </p>
              <div
                class="slds-box slds-box_x-small slds-m-bottom_small contact-box"
              >
                <h3 class="slds-text-title_caps slds-m-bottom_xx-small">
                  Operations Contact
                </h3>
                <template lwc:if={selectedFirm.noContact}>
                  <p class="slds-text-color_error no-contact">
                    Set an Operations Contact with an email address on the firm
                    to email it from here.
                  </p>
                </template>
                <template lwc:else>
                  <p class="contact">
                    <span class="choice-label">{selectedFirm.contactName}</span
                    ><span class="slds-text-color_weak"
                      >{selectedFirm.contactEmail}</span
                    >
                  </p>
                </template>
                <lightning-button
                  class="open-firm slds-m-top_x-small"
                  variant="base"
                  label="Open the firm"
                  data-id={selectedFirm.firmId}
                  onclick={handleOpenRecord}
                ></lightning-button>
              </div>
              <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                Questions in the next email
              </h3>
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_small question-table"
              >
                <thead>
                  <tr>
                    <th scope="col">Question</th>
                    <th scope="col">From</th>
                    <th scope="col">Asked</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={selectedFirm.questionViews} for:item="q">
                    <tr key={q.key}>
                      <td class="slds-cell-wrap">{q.text}</td>
                      <td class="slds-cell-wrap">{q.source}</td>
                      <td>{q.askedLabel}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template lwc:if={pendingAskHere}>
                <div
                  class="slds-box slds-box_x-small slds-theme_info slds-m-bottom_small pending-ask"
                  role="status"
                >
                  <p>{pendingAskText}</p>
                  <lightning-button
                    class="mark-asked slds-m-top_x-small slds-m-right_x-small"
                    label="Mark as asked"
                    disabled={busy}
                    onclick={handleMarkAsked}
                  ></lightning-button>
                  <lightning-button
                    class="not-sent slds-m-top_x-small"
                    variant="base"
                    label="I did not send it"
                    onclick={handleNotSent}
                  ></lightning-button>
                </div>
              </template>
              <lightning-button
                class="email-firm"
                variant="brand"
                label={selectedFirm.buttonLabel}
                data-id={selectedFirm.firmId}
                disabled={selectedFirm.noContact}
                onclick={handleEmailFirm}
              ></lightning-button>
            </div>
          </template>

          <!-- A file with an unknown layout -->
          <template lwc:if={selectedMapping}>
            <div class="mapping-detail">
              <h2 class="slds-text-heading_medium slds-m-bottom_x-small">
                {selectedMapping.title}
              </h2>
              <template lwc:if={selectedMapping.batchMessage}>
                <p class="slds-text-body_small slds-m-bottom_small">
                  {selectedMapping.batchMessage}
                </p>
              </template>
              <template lwc:if={selectedMapping.profileId}>
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Claude's proposed mapping: {selectedMapping.profileName}
                </h3>
                <p
                  class="rationale slds-box slds-box_x-small slds-m-bottom_small"
                >
                  {selectedMapping.rationale}
                </p>
                <lightning-button
                  class="activate slds-m-right_x-small"
                  variant="brand"
                  label="Activate mapping"
                  disabled={busy}
                  onclick={handleActivateMapping}
                ></lightning-button>
                <lightning-button
                  label="Open mapping"
                  data-id={selectedMapping.profileId}
                  onclick={handleOpenRecord}
                ></lightning-button>
              </template>
              <template lwc:else>
                <p class="slds-text-color_weak">
                  No proposal yet. Claude proposes a mapping when it is switched
                  on; otherwise create one in Mapping Profiles.
                </p>
              </template>
            </div>
          </template>
        </lightning-layout-item>
      </lightning-layout>
    </div>
  </lightning-card>

  <!-- Put on hold dialog -->
  <template lwc:if={showHold}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="hold-heading"
      class="slds-modal slds-fade-in-open hold-dialog"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="hold-heading" class="slds-modal__title slds-hyphenate">
            Put on hold
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small hold-intro">{holdIntro}</p>
          <template lwc:if={selectedIsGroup}>
            <p class="slds-text-title_bold slds-m-bottom_x-small hold-group">
              {holdGroupText}
            </p>
          </template>
          <template lwc:if={holdPrefilled}>
            <p
              class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
            >
              {holdPrefillText}
            </p>
          </template>
          <lightning-textarea
            class="hold-text"
            label="Question for the firm"
            value={holdText}
            max-length="2000"
            onchange={handleHoldText}
          ></lightning-textarea>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            class="slds-m-right_x-small"
            label="Cancel"
            onclick={handleCloseHold}
          ></lightning-button>
          <lightning-button
            class="hold-submit"
            variant="brand"
            label="Put on hold"
            disabled={holdDisabled}
            onclick={handleConfirmHold}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Upload dialog -->
  <template lwc:if={showUpload}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="upload-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="upload-heading" class="slds-modal__title slds-hyphenate">
            Upload a dealer file
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small">
            The file goes through the same steps as files from the data lake:
            mapping, matching, Claude and review.
          </p>
          <lightning-combobox
            class="upload-firm"
            label="Dealer"
            placeholder="Choose the dealer"
            options={uploadFirmOptions}
            value={uploadFirm}
            onchange={handleUploadFirm}
          ></lightning-combobox>
          <template lwc:if={uploadIsOther}>
            <lightning-input
              class="upload-other-firm"
              label="Dealer code (letters, digits, hyphens)"
              value={uploadOtherFirm}
              max-length="80"
              onchange={handleUploadOtherFirm}
            ></lightning-input>
          </template>
          <lightning-input
            class="upload-file slds-m-top_small"
            type="file"
            label="File (CSV, up to 1 MB)"
            accept=".csv,.txt"
            onchange={handleUploadFile}
          ></lightning-input>
          <p class="slds-text-body_small slds-m-top_xx-small">
            {uploadFileName}
          </p>
          <template lwc:if={uploadError}>
            <p
              class="slds-text-color_error slds-m-top_small upload-error"
              role="alert"
            >
              {uploadError}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            class="slds-m-right_x-small"
            label="Cancel"
            onclick={handleCloseUpload}
          ></lightning-button>
          <lightning-button
            class="upload-submit"
            variant="brand"
            label="Upload"
            disabled={uploadDisabled}
            onclick={handleUpload}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
