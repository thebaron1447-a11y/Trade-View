<template>
  <lightning-card title="Trade Review" icon-name="standard:approval">
    <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
      <span class="slds-badge slds-m-right_small claude-badge"
        >{claudeLabel}</span
      >
      <lightning-radio-group
        class="slds-m-right_small"
        name="scope"
        label="Show"
        variant="label-hidden"
        type="button"
        options={scopeOptions}
        value={scope}
        onchange={handleScopeChange}
      ></lightning-radio-group>
      <lightning-button-icon
        class="slds-m-right_x-small"
        icon-name="utility:refresh"
        alternative-text="Refresh"
        title="Refresh"
        onclick={handleRefresh}
      ></lightning-button-icon>
      <lightning-button
        class="open-upload"
        label="Upload file"
        icon-name="utility:upload"
        onclick={handleOpenUpload}
      ></lightning-button>
    </div>

    <div class="slds-p-horizontal_medium">
      <template lwc:if={working}>
        <div
          class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small working"
          role="status"
        >
          <lightning-icon
            icon-name="utility:sync"
            size="x-small"
            class="slds-m-right_x-small"
          ></lightning-icon>
          {workingText}
        </div>
      </template>
      <template lwc:if={loadError}>
        <div
          class="slds-text-color_error slds-m-bottom_small load-error"
          role="alert"
        >
          {loadError}
        </div>
      </template>
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading the review queue"
          size="small"
        ></lightning-spinner>
      </template>

      <lightning-layout multiple-rows>
        <!-- Queue -->
        <lightning-layout-item
          size="12"
          medium-device-size="4"
          padding="around-small"
        >
          <lightning-tabset active-tab-value={activeTab}>
            <lightning-tab
              label={codesLabel}
              value="codes"
              onactive={handleTabActive}
            >
              <template lwc:if={heldNote}>
                <div
                  class="slds-box slds-box_x-small slds-m-bottom_small held-note"
                >
                  {heldNote}
                </div>
              </template>
              <c-review-queue-table
                class="codes-table"
                items={codeTableItems}
                selected-key={selectedKey}
                first-label="Code or row"
                last-label="Held or amount"
                empty-text="No rep codes need review."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={rowsLabel}
              value="rows"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="rows-table"
                items={decisionTableItems}
                selected-key={selectedKey}
                empty-text="Nothing needs a decision."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={holdLabel}
              value="hold"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="hold-table"
                items={holdTableItems}
                selected-key={selectedKey}
                empty-text="Nothing is on hold."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={firmsLabel}
              value="firms"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="firms-table"
                items={firmTableItems}
                selected-key={selectedKey}
                first-label="Firm"
                type-label="Status"
                last-label="Questions"
                empty-text="No questions are waiting for a firm. Put a row on hold, or open a code review, to ask one."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label={mappingsLabel}
              value="mappings"
              onactive={handleTabActive}
            >
              <c-review-queue-table
                class="mappings-table"
                items={mappingTableItems}
                selected-key={selectedKey}
                first-label="File"
                type-label="Status"
                last-label=""
                empty-text="Every file format is known."
                onselect={handleSelect}
              ></c-review-queue-table>
            </lightning-tab>

            <lightning-tab
              label="Recent Files"
              value="files"
              onactive={handleTabActive}
            >
              <template lwc:if={hasFiles}>
                <ul>
                  <template for:each={fileViews} for:item="file">
                    <li
                      key={file.id}
                      class="queue-item slds-p-around_x-small file-item"
                    >
                      <span class="slds-text-title_bold slds-show"
                        >{file.sourceFirm} · {file.fileName}</span
                      >
                      <span class="slds-text-body_small slds-show"
                        >{file.summary}</span
                      >
                      <template lwc:if={file.message}>
                        <span
                          class="slds-text-body_small slds-text-color_error slds-show"
                          >{file.message}</span
                        >
                      </template>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p class="slds-text-color_weak">No files received yet.</p>
              </template>
            </lightning-tab>
          </lightning-tabset>
        </lightning-layout-item>

        <!-- Detail -->
        <lightning-layout-item
          size="12"
          medium-device-size="8"
          padding="around-small"
        >
          <template lwc:if={nothingSelected}>
            <div class="slds-box slds-text-color_weak nothing-selected">
              Choose an item on the left.
            </div>
          </template>

          <!-- A review row -->
          <template lwc:if={selectedRow}>
            <div class="row-detail">
              <h2
                class="slds-text-heading_medium slds-m-bottom_xx-small headline"
              >
                {selectedRow.title}
              </h2>
              <p
                class="slds-text-body_small slds-text-color_weak slds-m-bottom_small origin"
              >
                {selectedRow.rowType} · {selectedRow.subtitle} ·
                {selectedRow.name}
              </p>
              <template lwc:if={selectedIsOnHold}>
                <div
                  class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_small hold-box"
                >
                  <p class="slds-text-title_bold">
                    On hold since {selectedRow.heldSinceText} by
                    {selectedRow.heldByName}
                  </p>
                  <p class="hold-homework">{selectedRow.holdReason}</p>
                  <template lwc:if={selectedRow.askedLabel}>
                    <p class="slds-text-body_small">{selectedRow.askedLabel}</p>
                  </template>
                </div>
              </template>

              <template lwc:if={selectedIsGroup}>
                <div
                  class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small group-box"
                >
                  <p class="slds-text-title_bold group-summary">
                    {groupSummary}
                  </p>
                  <template lwc:if={issueRows}>
                    <table
                      class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_x-small issue-rows"
                    >
                      <thead>
                        <tr>
                          <th scope="col">File and row</th>
                          <th scope="col">Date</th>
                          <th scope="col">Code</th>
                          <th scope="col">Advisor</th>
                          <th scope="col">Firm</th>
                          <th scope="col">Fund</th>
                          <th scope="col">Amount</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={issueRows} for:item="i">
                          <tr key={i.key}>
                            <td class="slds-cell-wrap">{i.where}</td>
                            <td>{i.tradeDate}</td>
                            <td>{i.repCode}</td>
                            <td class="slds-cell-wrap">{i.advisorName}</td>
                            <td class="slds-cell-wrap">{i.firmName}</td>
                            <td class="slds-cell-wrap">{i.fundName}</td>
                            <td>{i.amountText}</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template lwc:if={issueRowsNote}>
                      <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                      >
                        {issueRowsNote}
                      </p>
                    </template>
                  </template>
                </div>
              </template>
              <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                  <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                    {fileHeading}
                  </h3>
                  <dl class="slds-list_horizontal slds-wrap">
                    <template for:each={fileFields} for:item="f">
                      <dt
                        key={f.labelKey}
                        class="slds-item_label slds-text-color_weak"
                      >
                        {f.label}
                      </dt>
                      <dd key={f.valueKey} class="slds-item_detail">
                        {f.value}
                      </dd>
                    </template>
                  </dl>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                  <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                    Why it needs review
                  </h3>
                  <ul class="slds-list_dotted reasons">
                    <template for:each={selectedRow.whyLines} for:item="reason">
                      <li key={reason}>{reason}</li>
                    </template>
                  </ul>
                </div>
              </div>

              <div class="slds-box slds-m-top_medium claude-box">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Claude's suggestion
                  <template lwc:if={selectedRow.hasConfidence}>
                    <span class={confidenceClass}>
                      <span class="slds-badge slds-m-left_x-small"
                        >{selectedRow.aiConfidence} confidence</span
                      >
                    </span>
                  </template>
                </h3>
                <template lwc:if={hasSuggestion}>
                  <template lwc:if={selectedRow.actionLabel}>
                    <p
                      class="slds-text-title_bold slds-m-bottom_x-small ai-action"
                    >
                      {selectedRow.actionLabel}
                    </p>
                  </template>
                  <template lwc:if={hasFieldTable}>
                    <table
                      class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_x-small field-table"
                    >
                      <thead>
                        <tr>
                          <th scope="col">Field</th>
                          <th scope="col">Suggestion</th>
                          <th scope="col">Confidence</th>
                          <th scope="col">Reason</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={fieldTable} for:item="l">
                          <tr key={l.key}>
                            <td>{l.field}</td>
                            <td class={l.valueClass}>{l.value}</td>
                            <td>
                              <span class={l.confidenceClass}
                                >{l.confidence}</span
                              >
                            </td>
                            <td class="slds-cell-wrap">{l.reason}</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </template>
                  <template lwc:else>
                    <template for:each={suggestedChoices} for:item="c">
                      <p key={c.label} class="choice">
                        <span class="slds-text-color_weak choice-label"
                          >{c.label}:</span
                        ><span class="choice-value">{c.value}</span>
                      </p>
                    </template>
                  </template>
                  <template lwc:if={suggestionText}>
                    <h3
                      class="slds-text-title_caps slds-m-top_small slds-m-bottom_xx-small"
                    >
                      Why
                    </h3>
                    <p class="suggestion">{suggestionText}</p>
                  </template>
                  <template lwc:if={selectedRow.aiHomework}>
                    <h3
                      class="slds-text-title_caps slds-m-top_small slds-m-bottom_xx-small"
                    >
                      Question for the firm
                    </h3>
                    <p class="homework">{selectedRow.aiHomework}</p>
                  </template>
                </template>
                <template lwc:else>
                  <p class="slds-text-color_weak claude-state">{claudeState}</p>
                </template>
                <template lwc:if={selectedRow.aiRequestId}>
                  <button
                    class="slds-button slds-m-top_x-small"
                    data-id={selectedRow.aiRequestId}
                    onclick={handleOpenRecord}
                  >
                    See the request ({selectedRow.aiRequestName})
                  </button>
                </template>
              </div>

              <template lwc:if={selectedRow.hasPlan}>
                <div class="slds-box slds-m-top_medium approval-plan">
                  <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                    Approving will
                  </h3>
                  <ul class="slds-list_dotted">
                    <template for:each={selectedRow.planLines} for:item="line">
                      <li key={line.key}>{line.text}</li>
                    </template>
                  </ul>
                </div>
              </template>

              <div class="slds-m-top_medium decision">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Your decision
                </h3>
                <p class="slds-text-body_small slds-m-bottom_x-small">
                  {decisionHelp}
                </p>
                <template lwc:if={selectedRow.needsFirm}>
                  <lightning-combobox
                    class="firm-choice"
                    label="Firm"
                    placeholder="Choose the firm"
                    options={firmOptions}
                    value={firmChoice}
                    onchange={handleFirmChoice}
                  ></lightning-combobox>
                </template>
                <template lwc:if={selectedRow.needsFund}>
                  <lightning-combobox
                    class="fund-choice"
                    label="Fund"
                    placeholder="Choose the fund"
                    options={fundOptions}
                    value={fundChoice}
                    onchange={handleFundChoice}
                  ></lightning-combobox>
                </template>
                <template lwc:if={selectedRow.needsAdvisor}>
                  <lightning-combobox
                    class="advisor-choice"
                    label="Advisor"
                    placeholder="Choose the advisor"
                    options={selectedRow.advisorOptions}
                    value={advisorChoice}
                    onchange={handleAdvisorChoice}
                  ></lightning-combobox>
                </template>
                <template lwc:if={selectedRow.canRemember}>
                  <lightning-input
                    class="slds-m-top_x-small remember"
                    type="checkbox"
                    label="Remember this spelling for future files"
                    checked={remember}
                    onchange={handleRemember}
                  ></lightning-input>
                </template>
                <div class="slds-m-top_small">
                  <lightning-button
                    class="accept slds-m-right_x-small"
                    variant="brand"
                    label={acceptLabel}
                    disabled={acceptDisabled}
                    onclick={handleAccept}
                  ></lightning-button>
                  <lightning-button
                    class="reject slds-m-right_x-small"
                    variant="destructive-text"
                    label={rejectLabel}
                    disabled={busy}
                    onclick={handleReject}
                  ></lightning-button>
                  <template lwc:if={selectedIsOpen}>
                    <lightning-button
                      class="hold slds-m-right_x-small"
                      label={holdButtonLabel}
                      icon-name="utility:clock"
                      disabled={busy}
                      onclick={handleOpenHold}
                    ></lightning-button>
                  </template>
                  <template lwc:if={selectedIsOnHold}>
                    <lightning-button
                      class="release slds-m-right_x-small"
                      label={releaseLabel}
                      disabled={busy}
                      onclick={handleRelease}
                    ></lightning-button>
                  </template>
                  <template lwc:if={isUnassigned}>
                    <lightning-button
                      class="assign"
                      label="Assign to me"
                      disabled={busy}
                      onclick={handleAssignToMe}
                    ></lightning-button>
                  </template>
                  <template lwc:if={isMine}>
                    <lightning-button
                      class="unassign"
                      label="Unassign"
                      disabled={busy}
                      onclick={handleUnassign}
                    ></lightning-button>
                  </template>
                  <template lwc:if={assignedToOther}>
                    <span class="slds-text-body_small slds-m-left_small"
                      >Assigned to {selectedRow.assignedToName}</span
                    >
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- A follow-up -->
          <template lwc:if={selectedFollowUp}>
            <div class="followup-detail">
              <h2 class="slds-text-heading_medium slds-m-bottom_x-small">
                {selectedFollowUp.title}
              </h2>
              <p
                class="slds-text-body_small slds-m-bottom_small followup-summary"
              >
                {selectedFollowUp.issueText} · {selectedFollowUp.subtitle}
              </p>
              <template lwc:if={hasHeldRows}>
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Held rows
                </h3>
                <table
                  class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_small held-table"
                >
                  <thead>
                    <tr>
                      <th scope="col">Date</th>
                      <th scope="col">Type</th>
                      <th scope="col">Advisor named</th>
                      <th scope="col">Fund</th>
                      <th scope="col">Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={heldRowViews} for:item="h">
                      <tr key={h.key}>
                        <td>{h.tradeDate}</td>
                        <td>{h.typeText}</td>
                        <td>{h.advisorText}</td>
                        <td>{h.fundText}</td>
                        <td>{h.amountText}</td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <template lwc:if={heldRowsNote}>
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-m-bottom_small"
                  >
                    {heldRowsNote}
                  </p>
                </template>
              </template>
              <div
                class="slds-box slds-box_x-small slds-m-bottom_small question-box"
              >
                <h3 class="slds-text-title_caps slds-m-bottom_xx-small">
                  Question for the firm
                </h3>
                <p class="followup-question">{selectedFollowUp.question}</p>
                <template lwc:if={selectedFollowUp.askedLabel}>
                  <p class="slds-text-body_small slds-text-color_weak">
                    {selectedFollowUp.askedLabel}
                  </p>
                </template>
              </div>
              <div class="slds-box claude-box">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Claude's suggestion
                  <template lwc:if={selectedFollowUp.hasConfidence}>
                    <span class={confidenceClass}>
                      <span class="slds-badge slds-m-left_x-small"
                        >{selectedFollowUp.aiConfidence} confidence</span
                      >
                    </span>
                  </template>
                </h3>
                <template lwc:if={hasSuggestion}>
                  <template lwc:if={hasFieldTable}>
                    <table
                      class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_x-small field-table"
                    >
                      <thead>
                        <tr>
                          <th scope="col">Field</th>
                          <th scope="col">Suggestion</th>
                          <th scope="col">Confidence</th>
                          <th scope="col">Reason</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={fieldTable} for:item="l">
                          <tr key={l.key}>
                            <td>{l.field}</td>
                            <td class={l.valueClass}>{l.value}</td>
                            <td>
                              <span class={l.confidenceClass}
                                >{l.confidence}</span
                              >
                            </td>
                            <td class="slds-cell-wrap">{l.reason}</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </template>
                  <template lwc:else>
                    <template for:each={suggestedChoices} for:item="c">
                      <p key={c.label} class="choice">
                        <span class="slds-text-color_weak choice-label"
                          >{c.label}:</span
                        ><span class="choice-value">{c.value}</span>
                      </p>
                    </template>
                  </template>
                  <template lwc:if={suggestionText}>
                    <h3
                      class="slds-text-title_caps slds-m-top_small slds-m-bottom_xx-small"
                    >
                      Why
                    </h3>
                    <p class="suggestion">{suggestionText}</p>
                  </template>
                </template>
                <template lwc:else>
                  <p class="slds-text-color_weak claude-state">{claudeState}</p>
                </template>
              </div>
              <div class="slds-m-top_medium decision">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Your decision
                </h3>
                <p class="slds-text-body_small slds-m-bottom_x-small code-help">
                  {codeReviewHelp}
                </p>
                <template lwc:if={selectedFollowUp.canCredit}>
                  <lightning-combobox
                    class="credit-choice"
                    label="Advisor to credit"
                    placeholder="Choose the advisor"
                    options={selectedFollowUp.creditOptions}
                    value={creditChoice}
                    onchange={handleCreditChoice}
                  ></lightning-combobox>
                </template>
                <div class="slds-m-top_small">
                  <template lwc:if={selectedFollowUp.canCredit}>
                    <lightning-button
                      class="credit slds-m-right_x-small"
                      variant="brand"
                      label={creditLabel}
                      disabled={creditDisabled}
                      onclick={handleCredit}
                    ></lightning-button>
                  </template>
                  <lightning-button
                    class="rematch slds-m-right_x-small"
                    label="Code fixed: re-match"
                    disabled={busy}
                    onclick={handleRematch}
                  ></lightning-button>
                  <lightning-button
                    class="send-to-review slds-m-right_x-small"
                    label="Decide rows one by one"
                    disabled={busy}
                    onclick={handleSendToReview}
                  ></lightning-button>
                  <template lwc:if={isUnassigned}>
                    <lightning-button
                      class="assign"
                      label="Assign to me"
                      disabled={busy}
                      onclick={handleAssignToMe}
                    ></lightning-button>
                  </template>
                  <template lwc:if={isMine}>
                    <lightning-button
                      class="unassign"
                      label="Unassign"
                      disabled={busy}
                      onclick={handleUnassign}
                    ></lightning-button>
                  </template>
                  <template lwc:if={assignedToOther}>
                    <span class="slds-text-body_small slds-m-left_small"
                      >Assigned to {selectedFollowUp.assignedToName}</span
                    >
                  </template>
                </div>
                <button
                  class="slds-button slds-m-top_x-small open-followup"
                  data-id={selectedFollowUp.id}
                  onclick={handleOpenRecord}
                >
                  Open the follow-up record
                </button>
              </div>
            </div>
          </template>

          <!-- A firm with questions waiting for its answer -->
          <template lwc:if={selectedFirm}>
            <div class="firm-detail">
              <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">
                {selectedFirm.firmName}
              </h2>
              <p class="slds-text-body_small slds-m-bottom_small firm-status">
                {selectedFirm.questionsText} · {selectedFirm.status}
              </p>
              <div
                class="slds-box slds-box_x-small slds-m-bottom_small contact-box"
              >
                <h3 class="slds-text-title_caps slds-m-bottom_xx-small">
                  Operations Contact
                </h3>
                <template lwc:if={selectedFirm.noContact}>
                  <p class="slds-text-color_error no-contact">
                    Set an Operations Contact with an email address on the firm
                    to email it from here.
                  </p>
                </template>
                <template lwc:else>
                  <p class="contact">
                    <span class="choice-label">{selectedFirm.contactName}</span
                    ><span class="slds-text-color_weak"
                      >{selectedFirm.contactEmail}</span
                    >
                  </p>
                </template>
                <lightning-button
                  class="open-firm slds-m-top_x-small"
                  variant="base"
                  label="Open the firm"
                  data-id={selectedFirm.firmId}
                  onclick={handleOpenRecord}
                ></lightning-button>
              </div>
              <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                Questions in the next email
              </h3>
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_small question-table"
              >
                <thead>
                  <tr>
                    <th scope="col">Question</th>
                    <th scope="col">From</th>
                    <th scope="col">Asked</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={selectedFirm.questionViews} for:item="q">
                    <tr key={q.key}>
                      <td class="slds-cell-wrap">{q.text}</td>
                      <td class="slds-cell-wrap">{q.source}</td>
                      <td>{q.askedLabel}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template lwc:if={pendingAskHere}>
                <div
                  class="slds-box slds-box_x-small slds-theme_info slds-m-bottom_small pending-ask"
                  role="status"
                >
                  <p>{pendingAskText}</p>
                  <lightning-button
                    class="mark-asked slds-m-top_x-small slds-m-right_x-small"
                    label="Mark as asked"
                    disabled={busy}
                    onclick={handleMarkAsked}
                  ></lightning-button>
                  <lightning-button
                    class="not-sent slds-m-top_x-small"
                    variant="base"
                    label="I did not send it"
                    onclick={handleNotSent}
                  ></lightning-button>
                </div>
              </template>
              <lightning-button
                class="email-firm"
                variant="brand"
                label={selectedFirm.buttonLabel}
                data-id={selectedFirm.firmId}
                disabled={selectedFirm.noContact}
                onclick={handleEmailFirm}
              ></lightning-button>
            </div>
          </template>

          <!-- A file with an unknown layout -->
          <template lwc:if={selectedMapping}>
            <div class="mapping-detail">
              <h2 class="slds-text-heading_medium slds-m-bottom_x-small">
                {selectedMapping.title}
              </h2>
              <template lwc:if={selectedMapping.batchMessage}>
                <p class="slds-text-body_small slds-m-bottom_small">
                  {selectedMapping.batchMessage}
                </p>
              </template>
              <template lwc:if={selectedMapping.profileId}>
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                  Claude's proposed mapping: {selectedMapping.profileName}
                </h3>
                <p
                  class="rationale slds-box slds-box_x-small slds-m-bottom_small"
                >
                  {selectedMapping.rationale}
                </p>
                <lightning-button
                  class="activate slds-m-right_x-small"
                  variant="brand"
                  label="Activate mapping"
                  disabled={busy}
                  onclick={handleActivateMapping}
                ></lightning-button>
                <lightning-button
                  label="Open mapping"
                  data-id={selectedMapping.profileId}
                  onclick={handleOpenRecord}
                ></lightning-button>
              </template>
              <template lwc:else>
                <p class="slds-text-color_weak">
                  No proposal yet. Claude proposes a mapping when it is switched
                  on; otherwise create one in Mapping Profiles.
                </p>
              </template>
            </div>
          </template>
        </lightning-layout-item>
      </lightning-layout>
    </div>
  </lightning-card>

  <!-- Put on hold dialog -->
  <template lwc:if={showHold}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="hold-heading"
      class="slds-modal slds-fade-in-open hold-dialog"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="hold-heading" class="slds-modal__title slds-hyphenate">
            Put on hold
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small">
            The row waits on the On Hold tab until you accept, reject or release
            it. Say what needs to be found out; it becomes the question in the
            firm's follow-up email.
          </p>
          <template lwc:if={selectedIsGroup}>
            <p class="slds-text-title_bold slds-m-bottom_x-small hold-group">
              {holdGroupText}
            </p>
          </template>
          <template lwc:if={holdPrefilled}>
            <p
              class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
            >
              Filled in from Claude's suggestion. Edit it as needed.
            </p>
          </template>
          <lightning-textarea
            class="hold-text"
            label="What needs to be found out"
            value={holdText}
            max-length="2000"
            onchange={handleHoldText}
          ></lightning-textarea>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            class="slds-m-right_x-small"
            label="Cancel"
            onclick={handleCloseHold}
          ></lightning-button>
          <lightning-button
            class="hold-submit"
            variant="brand"
            label="Put on hold"
            disabled={holdDisabled}
            onclick={handleConfirmHold}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Upload dialog -->
  <template lwc:if={showUpload}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="upload-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="upload-heading" class="slds-modal__title slds-hyphenate">
            Upload a dealer file
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small">
            The file goes through the same steps as files from the data lake:
            mapping, matching, Claude and review.
          </p>
          <lightning-combobox
            class="upload-firm"
            label="Dealer"
            placeholder="Choose the dealer"
            options={uploadFirmOptions}
            value={uploadFirm}
            onchange={handleUploadFirm}
          ></lightning-combobox>
          <template lwc:if={uploadIsOther}>
            <lightning-input
              class="upload-other-firm"
              label="Dealer code (letters, digits, hyphens)"
              value={uploadOtherFirm}
              max-length="80"
              onchange={handleUploadOtherFirm}
            ></lightning-input>
          </template>
          <lightning-input
            class="upload-file slds-m-top_small"
            type="file"
            label="File (CSV, up to 1 MB)"
            accept=".csv,.txt"
            onchange={handleUploadFile}
          ></lightning-input>
          <p class="slds-text-body_small slds-m-top_xx-small">
            {uploadFileName}
          </p>
          <template lwc:if={uploadError}>
            <p
              class="slds-text-color_error slds-m-top_small upload-error"
              role="alert"
            >
              {uploadError}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            class="slds-m-right_x-small"
            label="Cancel"
            onclick={handleCloseUpload}
          ></lightning-button>
          <lightning-button
            class="upload-submit"
            variant="brand"
            label="Upload"
            disabled={uploadDisabled}
            onclick={handleUpload}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
